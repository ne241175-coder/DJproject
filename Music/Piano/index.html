<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ブラウザピアノ & コードファインダー</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    🎹 ChordFinder (ブラウザピアノ & コード判定)
</header>

<div id="pitch-display">
    <div id="chord-result">--</div>
    <div id="display-content">鍵盤を押すとコードを判定します</div>
</div>

<div class="keyboard">

        <div class="bk" id="37"></div><div class="wk" id="38"></div><div class="bk" id="39"></div><div class="wk" id="40"></div><div class="wk" id="41"></div><div class="bk" id="42"></div><div class="wk" id="43"></div>
        <div class="bk" id="44"><span class="k">a</span></div><div class="wk" id="45"><span class="k">Z</span></div><div class="bk" id="46"><span class="k">s</span></div><div class="wk" id="47"><span class="k">X</span></div>

        <div class="wk" id="60"><span class="r">E<br>/</span></div><div class="bk" id="61"><span class="k">4<br>:</span></div><div class="wk" id="62"><span class="k">R<br>\</span></div><div class="bk" id="63"><span class="k">5<br>]</span></div>
        <div class="wk" id="64"><span class="k">T</span></div><div class="wk" id="65"><span class="k">Y</span></div><div class="bk" id="66"><span class="k">7</span></div><div class="wk" id="67"><span class="k">U</span></div>

        <div class="wk" id="72"><span class="r">P</span></div><div class="bk" id="73"><span class="k">-</span></div><div class="wk" id="74"><span class="k">@</span></div><div class="bk" id="75"><span class="k>^</span></div>
        <div class="wk" id="76"><span class="k">[</span></div><div class="wk" id="77"></div><div class="bk" id="78"></div><div class="wk" id="79"></div><div class="bk" id="80"></div><div class="wk" id="81"></div><div class="bk" id="82"></div><div class="wk" id="83"></div><div class="wk" id="84"></div>

    </div>
</div>

<div class="attachment">
    音量: <span class="arrow" onclick="pianovlm(-1)">&thinsp;↓&thinsp;</span> <span class="arrow" onclick="pianovlm(1)">&thinsp;↑&thinsp;</span> 
    <input type="text" id="vol_piano" class="vlm_piano" maxlength="4" value="5">
    <span style="margin-left: 20px; color: #666;">※PCキーボードでも演奏可能です（A, Z, S, X, C...）</span>
</div>

<script src="chord-finder.js"></script>
<script src="piano.js"></script>

</html>
